<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="SkillLens: your AI sports coach, in your camera">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1414"/>
      <stop offset="0.55" stop-color="#141414"/>
      <stop offset="1" stop-color="#3a0f12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#d7282f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d7282f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="112" fill="#f6d5d2" font-size="15" font-weight="700" letter-spacing="5">AI SPORTS COACH · 10 SPORTS · FREE</text>
    <text x="68" y="210" fill="#ffffff" font-size="96" font-weight="800" letter-spacing="-2">SkillLens</text>
    <text x="72" y="262" fill="#ffffff" fill-opacity="0.85" font-size="28" font-weight="600">Your AI sports coach, in your camera.</text>
    <text x="72" y="304" fill="#ffffff" fill-opacity="0.55" font-size="18">Coaching for everyone who can't afford a coach, with just a phone.</text>
  </g>

  <!-- Pose skeleton: a smash at full reach -->
  <g transform="translate(930 60)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="80" cy="48" r="22"/>
    <path d="M80 70 L84 170"/>
    <path d="M80 92 L130 60 L168 6"/>
    <path d="M80 92 L34 128 L20 170"/>
    <path d="M84 170 L52 228 L40 290"/>
    <path d="M84 170 L120 226 L150 284"/>
  </g>
  <g transform="translate(930 60)" fill="#d7282f">
    <circle cx="80" cy="92" r="7"/><circle cx="130" cy="60" r="7"/><circle cx="168" cy="6" r="7"/>
    <circle cx="34" cy="128" r="7"/><circle cx="20" cy="170" r="7"/><circle cx="84" cy="170" r="7"/>
    <circle cx="52" cy="228" r="7"/><circle cx="40" cy="290" r="7"/><circle cx="120" cy="226" r="7"/><circle cx="150" cy="284" r="7"/>
  </g>
  <g transform="translate(930 60)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">
    <circle cx="130" cy="60" r="20" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5 4"/>
    <rect x="160" y="74" width="122" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/>
    <text x="176" y="94" fill="#ffffff">Elbow 115°</text>
    <rect x="-150" y="196" width="146" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/>
    <text x="-134" y="216" fill="#ffffff">Score 79 / 100</text>
  </g>
</svg>
